name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Block secrets and real data
        run: |
          bad=$(git ls-files | grep -E '^(\.env($|\.)|data/(private|real)/)|\.(pem|key)$' | grep -v '^\.env\.example$' || true)
          if [ -n "$bad" ]; then echo "Files that must never be committed:"; echo "$bad"; exit 1; fi
